<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a8f63">
<meta name="description" content="Instagram va Telegram sotuvchilari uchun tayyor onlayn do'kon. Mahsulot qo'shing, havolani ulashing, buyurtma oling.">
<title>MiniDokon</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%230a8f63'/%3E%3Cpath d='M8 13l1.5-5h13L24 13M9 13v11h14V13' fill='none' stroke='white' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Plus+Jakarta+Sans:wght@400..800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
/* Yo'nalish: toza, premium savdo platformasi. Zumrad yashil asosiy rang, oltin faqat Pro uchun. */
:root{
  --bg:#f3f6f4; --surface:#ffffff; --surface-2:#eaf0ed; --ink:#0b1512; --ink-2:#3b4a43; --mute:#6c7b74;
  --line:#dde5e0; --brand:#0a8f63; --brand-2:#067050; --brand-soft:#e1f4ec; --on-brand:#ffffff;
  --gold:#9a6b12; --gold-soft:#f8efd9; --danger:#b3261e; --danger-soft:#fbe9e7;
  --shadow:0 1px 2px rgba(11,21,18,.05),0 8px 24px -8px rgba(11,21,18,.12);
  --shadow-lg:0 24px 60px -20px rgba(6,60,42,.35);
  --font-display:"Bricolage Grotesque","Plus Jakarta Sans",system-ui,sans-serif;
  --font-body:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#08100d; --surface:#111b17; --surface-2:#182520; --ink:#e9f2ed; --ink-2:#b4c4bb; --mute:#83958b;
    --line:#223129; --brand:#2fd49a; --brand-2:#5be3b4; --brand-soft:#0f2a20; --on-brand:#04251a;
    --gold:#e3b559; --gold-soft:#2a2210; --danger:#ff8f86; --danger-soft:#2d1614;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px -10px rgba(0,0,0,.6);
    --shadow-lg:0 24px 60px -20px rgba(0,0,0,.7);
    color-scheme:dark;
  }
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{font-family:var(--font-body);background:var(--bg);color:var(--ink);line-height:1.55;min-height:100vh;-webkit-font-smoothing:antialiased;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
a{color:inherit}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:8px}
h1,h2,h3{font-family:var(--font-display);letter-spacing:-.02em;text-wrap:balance}
.wrap{max-width:1080px;margin:0 auto}
svg{flex:none}

/* ---- tugmalar ---- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);padding:0 18px;height:46px;border-radius:12px;cursor:pointer;font-weight:700;font-size:15px;text-decoration:none;transition:transform .12s,background .15s,border-color .15s,box-shadow .15s;white-space:nowrap}
.btn:hover{border-color:var(--mute)}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--on-brand);box-shadow:0 8px 20px -8px var(--brand)}
.btn.primary:hover{background:var(--brand-2);border-color:var(--brand-2)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.sm{height:36px;padding:0 12px;font-size:13.5px;border-radius:10px}
.btn.lg{height:54px;padding:0 26px;font-size:16px;border-radius:14px}
.btn.block{width:100%}
.btn.danger{color:var(--danger)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#fff}
.btn[disabled]{opacity:.5;pointer-events:none}
.icon-btn{width:36px;height:36px;padding:0}

/* ---- yuqori panel ---- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;margin:0 calc(-1*max(16px,env(safe-area-inset-left,0px)));padding:0 max(16px,env(safe-area-inset-left,0px));background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid var(--line)}
.top .in{max-width:1080px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;height:64px;gap:10px}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-weight:800;font-size:20px;letter-spacing:-.03em;text-decoration:none;cursor:pointer;min-width:0}
.logo .mark{width:34px;height:34px;border-radius:10px;background:var(--brand);color:var(--on-brand);display:flex;align-items:center;justify-content:center}
.logo span.t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav{display:flex;gap:4px;align-items:center}
.nav a.l{padding:8px 12px;border-radius:10px;font-weight:600;font-size:14.5px;color:var(--ink-2);text-decoration:none;cursor:pointer}
.nav a.l:hover{background:var(--surface-2)}
@media(max-width:720px){.nav a.l{display:none}}
.actions{display:flex;gap:8px;align-items:center}

/* ---- bosh sahifa ---- */
.hero{position:relative;padding:56px 0 40px;display:grid;gap:40px;grid-template-columns:1.1fr .9fr;align-items:center}
@media(max-width:860px){.hero{grid-template-columns:1fr;padding-top:36px}}
.hero::before{content:"";position:absolute;inset:-80px -40vw auto;height:520px;background:radial-gradient(60% 60% at 70% 20%,color-mix(in srgb,var(--brand) 22%,transparent),transparent 70%);z-index:-1;pointer-events:none}
.eyebrow{display:inline-flex;align-items:center;gap:8px;padding:6px 12px 6px 8px;border-radius:999px;background:var(--brand-soft);color:var(--brand-2);font-weight:700;font-size:13px;margin-bottom:18px}
.eyebrow i{width:20px;height:20px;border-radius:50%;background:var(--brand);color:var(--on-brand);display:flex;align-items:center;justify-content:center}
.hero h1{font-size:clamp(36px,6.4vw,64px);line-height:1.04;font-weight:800;margin-bottom:18px}
.hero h1 em{font-style:normal;color:var(--brand)}
.hero p.lead{font-size:clamp(16px,2.2vw,19px);color:var(--ink-2);max-width:520px;margin-bottom:26px}
.cta{display:flex;gap:10px;flex-wrap:wrap}
.trust{display:flex;gap:18px;flex-wrap:wrap;margin-top:26px;color:var(--mute);font-size:14px;font-weight:600}
.trust span{display:flex;gap:6px;align-items:center}
.trust svg{color:var(--brand)}

.phone{position:relative;max-width:320px;margin:0 auto;border-radius:38px;padding:10px;background:var(--ink);box-shadow:var(--shadow-lg)}
.phone .scr{border-radius:30px;background:var(--bg);overflow:hidden;color:var(--ink)}
.phone .bar{display:flex;align-items:center;gap:10px;padding:14px 14px 10px}
.phone .av{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#0a8f63,#7ad9b6);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-family:var(--font-display)}
.phone .bar b{display:block;font-size:14px;line-height:1.2}
.phone .bar small{color:var(--mute);font-size:11.5px}
.phone .tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:6px 12px 14px}
.phone .tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.phone .tile .im{aspect-ratio:1;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.9)}
.phone .tile .tx{padding:7px 9px 9px;font-size:11.5px;line-height:1.3}
.phone .tile .tx b{display:block;font-size:12px}
.phone .tile .tx span{color:var(--brand-2);font-weight:800}
.phone .order{margin:0 12px 14px;padding:11px;border-radius:12px;background:var(--brand);color:var(--on-brand);display:flex;justify-content:space-between;align-items:center;font-size:12.5px;font-weight:700}
.phone .tag{position:absolute;top:-12px;right:-8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:12px;font-weight:700;box-shadow:var(--shadow);display:flex;gap:6px;align-items:center}
.phone .tag i{width:8px;height:8px;border-radius:50%;background:var(--brand);display:block}

.strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:0;border:1px solid var(--line);border-radius:18px;background:var(--surface);overflow:hidden;margin:16px 0 64px}
.strip div{padding:20px 22px;border-right:1px solid var(--line)}
.strip div:last-child{border-right:0}
.strip b{display:block;font-family:var(--font-display);font-size:26px;letter-spacing:-.03em}
.strip span{color:var(--mute);font-size:14px}
@media(max-width:700px){.strip div{border-right:0;border-bottom:1px solid var(--line)}.strip div:last-child{border-bottom:0}}

.section{padding:0 0 72px}
.section .head{max-width:560px;margin-bottom:28px}
.section .kicker{color:var(--brand);font-weight:800;font-size:13px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:8px}
.section h2{font-size:clamp(26px,4.4vw,40px);line-height:1.1;margin-bottom:10px}
.section .head p{color:var(--ink-2);font-size:17px}
.feat{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.feat .f{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px}
.feat .ic{width:44px;height:44px;border-radius:12px;background:var(--brand-soft);color:var(--brand-2);display:flex;align-items:center;justify-content:center;margin-bottom:14px}
.feat h3{font-size:18px;margin-bottom:6px}
.feat p{color:var(--ink-2);font-size:15px}
.how{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:0;counter-reset:s}
.how .s{padding:6px 24px 6px 0;position:relative}
.how .s .n{width:40px;height:40px;border-radius:50%;border:2px solid var(--brand);color:var(--brand);display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:800;margin-bottom:12px;background:var(--bg)}
.how .s h3{font-size:17px;margin-bottom:4px}
.how .s p{color:var(--ink-2);font-size:14.5px}
.plans{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px;max-width:760px}
.plan{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:26px}
.plan h3{font-size:20px}
.plan .pr{font-family:var(--font-display);font-size:40px;font-weight:800;letter-spacing:-.04em;margin:8px 0 14px}
.plan .pr small{font-family:var(--font-body);font-size:14px;font-weight:600;color:var(--mute);letter-spacing:0}
.plan ul{list-style:none;display:grid;gap:10px;margin-bottom:20px}
.plan li{display:flex;gap:10px;font-size:15px;color:var(--ink-2)}
.plan li svg{color:var(--brand);margin-top:3px}
.plan.pro{border:1.5px solid var(--gold);background:linear-gradient(180deg,var(--gold-soft),var(--surface) 60%)}
.plan.pro .badge-gold{display:inline-block;background:var(--gold);color:#fff;font-size:12px;font-weight:800;padding:3px 10px;border-radius:999px;margin-bottom:8px}
details.q{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:0 18px;margin-bottom:10px}
details.q summary{cursor:pointer;font-weight:700;padding:16px 0;list-style:none;display:flex;justify-content:space-between;gap:12px;align-items:center}
details.q summary::-webkit-details-marker{display:none}
details.q summary svg{transition:transform .2s;color:var(--mute)}
details.q[open] summary svg{transform:rotate(45deg)}
details.q p{color:var(--ink-2);padding-bottom:16px;font-size:15px}
.banner{background:var(--ink);color:var(--bg);border-radius:24px;padding:clamp(28px,6vw,56px);display:flex;gap:20px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:56px}
.banner h2{font-size:clamp(24px,4vw,36px);max-width:520px}
.foot{border-top:1px solid var(--line);padding:26px 0 40px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;color:var(--mute);font-size:14px}
.foot a{color:var(--brand);font-weight:700;cursor:pointer;text-decoration:none}

/* ---- shakllar ---- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:var(--shadow)}
.form{display:grid;gap:14px}
label.f{display:grid;gap:6px;font-size:13.5px;font-weight:700;color:var(--ink-2)}
label.f .h{font-weight:500;color:var(--mute);font-size:12.5px}
input[type=text],input[type=email],input[type=password],input[type=tel],input[type=number],input[type=search],textarea,select{width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:0 14px;height:48px;outline:none;transition:border-color .15s,box-shadow .15s;color:var(--ink)}
textarea{height:auto;min-height:84px;padding:12px 14px;resize:vertical}
input:focus,textarea:focus,select:focus{border-color:var(--brand);box-shadow:0 0 0 4px color-mix(in srgb,var(--brand) 18%,transparent)}
input[type=file]{padding:10px 12px;height:auto}
.prefix{display:flex;align-items:center;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;overflow:hidden}
.prefix:focus-within{border-color:var(--brand);box-shadow:0 0 0 4px color-mix(in srgb,var(--brand) 18%,transparent)}
.prefix span{padding:0 4px 0 14px;color:var(--mute);font-weight:600;font-size:14px;white-space:nowrap}
.prefix input{border:0;box-shadow:none!important;padding-left:2px;min-width:0}
.msg{padding:11px 14px;border-radius:12px;font-size:14px;font-weight:600}
.msg.err{background:var(--danger-soft);color:var(--danger)}
.msg.ok{background:var(--brand-soft);color:var(--brand-2)}
.auth{max-width:440px;margin:40px auto}
.auth h2{font-size:28px;margin-bottom:4px}
.auth .sub{color:var(--mute);margin-bottom:18px}

/* ---- panel ---- */
.dash-head{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:24px 0 8px}
.dash-head h1{font-size:clamp(24px,4vw,32px)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12.5px;font-weight:800;background:var(--surface-2);color:var(--mute)}
.pill.pro{background:var(--gold-soft);color:var(--gold)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.stat small{color:var(--mute);font-weight:600;font-size:12.5px}
.stat b{display:block;font-family:var(--font-display);font-size:28px;letter-spacing:-.03em;line-height:1.2}
.stat.hot b{color:var(--brand)}
.linkbox{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--brand-soft);border:1px solid color-mix(in srgb,var(--brand) 25%,transparent);border-radius:16px;padding:12px 14px}
.linkbox .u{-webkit-user-select:all;user-select:all;flex:1;min-width:0;font-weight:700;font-size:14.5px;color:var(--brand-2);word-break:break-all;display:flex;gap:8px;align-items:center}
.linkbox .bt{display:flex;gap:8px;flex-wrap:wrap}
.seg{display:flex;gap:4px;background:var(--surface-2);padding:4px;border-radius:14px;margin:18px 0;overflow-x:auto}
.seg button{flex:1;border:0;background:transparent;border-radius:10px;height:40px;padding:0 14px;cursor:pointer;font-weight:700;font-size:14px;color:var(--mute);display:flex;gap:8px;align-items:center;justify-content:center;white-space:nowrap}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.badge{background:var(--brand);color:var(--on-brand);border-radius:999px;min-width:20px;height:20px;padding:0 6px;font-size:12px;font-weight:800;display:inline-flex;align-items:center;justify-content:center}
.toolbar{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap}
.toolbar .cnt{color:var(--mute);font-weight:600;font-size:14px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(2,1fr)}
@media(min-width:640px){.grid{grid-template-columns:repeat(3,1fr);gap:16px}}
@media(min-width:900px){.grid{grid-template-columns:repeat(4,1fr)}}
.prod{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column;transition:transform .18s,box-shadow .18s;min-width:0}
.prod:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.prod .im{aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.92);overflow:hidden;cursor:pointer;position:relative}
.prod .im img{width:100%;height:100%;object-fit:cover;display:block}
.prod .bd{padding:12px 14px 6px;display:grid;gap:3px;flex:1;min-width:0}
.prod .nm{font-weight:700;font-size:15px;line-height:1.3;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.prod .pc{font-family:var(--font-display);font-weight:800;font-size:17px;color:var(--brand-2);letter-spacing:-.02em}
.prod .ac{padding:8px 12px 12px;display:flex;gap:6px}
.prod.off .im{opacity:.45}
.prod .flag{position:absolute;top:8px;left:8px;background:rgba(0,0,0,.65);color:#fff;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px}
.order{display:grid;gap:8px;margin-bottom:10px}
.order .meta{color:var(--mute);font-size:13px}
.order a.ph{color:var(--brand-2);font-weight:800;text-decoration:none}
.st{font-size:12px;font-weight:800;padding:3px 10px;border-radius:999px;background:var(--gold-soft);color:var(--gold)}
.st.done{background:var(--brand-soft);color:var(--brand-2)}
.st.cancelled{background:var(--surface-2);color:var(--mute)}
.empty{text-align:center;color:var(--mute);padding:44px 16px;border:1.5px dashed var(--line);border-radius:18px}
.empty svg{color:var(--brand);margin-bottom:10px}
.empty b{display:block;color:var(--ink);font-family:var(--font-display);font-size:18px;margin-bottom:4px}

/* ---- ochiq do'kon ---- */
.cover{margin-top:16px;border-radius:24px;overflow:hidden;position:relative;color:#fff;padding:clamp(22px,5vw,40px);min-height:170px;display:flex;align-items:flex-end}
.cover::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 20%,rgba(0,0,0,.35));pointer-events:none}
.cover .ct{position:relative;z-index:1;display:flex;gap:16px;align-items:center;flex-wrap:wrap;width:100%}
.cover .big{width:68px;height:68px;border-radius:20px;background:rgba(255,255,255,.2);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:800;font-size:30px;border:1px solid rgba(255,255,255,.35)}
.cover h1{font-size:clamp(26px,5vw,40px);line-height:1.1}
.cover p{opacity:.92;max-width:560px;margin-top:2px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 6px}
.chip{display:inline-flex;gap:8px;align-items:center;padding:0 14px;height:38px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:14px;font-weight:600;text-decoration:none;cursor:pointer}
.chip:hover{border-color:var(--brand)}
.chip svg{color:var(--brand)}
.search{position:relative;margin:14px 0 18px}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--mute)}
.search input{padding-left:44px;height:50px;border-radius:14px}
.qty{display:inline-flex;align-items:center;border:1.5px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.qty button{width:38px;height:38px;border:0;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center}
.qty button:hover{background:var(--surface-2)}
.qty span{min-width:30px;text-align:center;font-weight:800}
.cartbar{position:fixed;left:0;right:0;bottom:0;z-index:40;padding:10px max(16px,env(safe-area-inset-left,0px)) calc(10px + env(safe-area-inset-bottom,0px));pointer-events:none}
.cartbar .in{max-width:560px;margin:0 auto;pointer-events:auto;background:var(--ink);color:var(--bg);border-radius:18px;padding:10px 10px 10px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px;box-shadow:0 16px 40px -12px rgba(0,0,0,.5);cursor:pointer}
.cartbar b{font-family:var(--font-display);font-size:17px}
.cartbar small{opacity:.75;display:block;font-size:12.5px}
.cartbar .go{height:44px;padding:0 18px;border-radius:12px;background:var(--brand);color:var(--on-brand);border:0;font-weight:800;display:flex;align-items:center;gap:8px;cursor:pointer}

/* ---- oyna ---- */

async function copyText(t){
  t = String(t);
  try{ if (navigator.clipboard && window.isSecureContext){ await navigator.clipboard.writeText(t); return true; } }catch(_){}
  try{
    const ta = document.createElement('textarea');
    ta.value = t; ta.setAttribute('readonly','');
    ta.style.cssText = 'position:fixed;top:0;left:0;width:1px;height:1px;opacity:0;font-size:16px';
    document.body.appendChild(ta); ta.focus(); ta.select(); ta.setSelectionRange(0,t.length);
    const ok = document.execCommand('copy');
    document.body.removeChild(ta);
    return ok;
  }catch(_){ return false; }
}

async function loadMine(){
  if (!S.user){ S.store=null; S.products=[]; S.orders=[]; return; }
  const { data:st } = await sb.from('mdk_stores').select('*').eq('owner', S.user.id).maybeSingle();
  S.store = st || null;
  if (st){
    const [p,o,pay] = await Promise.all([
      sb.from('mdk_products').select('*').eq('store_id', st.id).order('created_at',{ascending:false}),
      sb.from('mdk_orders').select('*').eq('store_id', st.id).order('created_at',{ascending:false}).limit(300),
      sb.from('mdk_payments').select('*').eq('store_id', st.id).order('created_at',{ascending:false}).limit(20)
    ]);
    S.products = p.data||[]; S.orders = o.data||[]; S.payments = pay.data||[];
  } else { S.products=[]; S.orders=[]; S.payments=[]; }
}
async function loadShop(slug){
  const { data:st } = await sb.from('mdk_stores').select('id,slug,name,description,telegram,phone').eq('slug', slug).maybeSingle();
  S.shop = st || null; S.shopProducts = [];
  if (st){
    const { data:p } = await sb.from('mdk_products').select('*').eq('store_id', st.id).eq('active', true).order('created_at',{ascending:false});
    S.shopProducts = p||[];
    const saved = lsGet('mdk-cart-'+slug) || {};
    S.cart = {};
    for (const id in saved) if (S.shopProducts.some(x=>x.id===id) && saved[id]>0) S.cart[id]=saved[id];
  }
}
async function checkAdmin(){
  if (!S.user){ S.isAdmin=false; return; }
  try{ const { data, error } = await sb.rpc('mdk_is_admin'); S.isAdmin = !error && data===true; }catch(e){ S.isAdmin=false; }
}
async function loadAdmin(){
  S.admWarn = '';
  const [pay, stats, dir] = await Promise.all([
    sb.from('mdk_payments').select('*, mdk_stores(name,slug)').order('created_at',{ascending:false}).limit(200),
    sb.rpc('mdk_admin_stats'),
    sb.rpc('mdk_admin_directory')
  ]);
  if (stats.error || dir.error) S.admWarn = "Admin funksiyalari bazada topilmadi. admin-setup.sql faylini Supabase SQL Editor'da ishga tushiring.";
  const list = pay.data || [];
  const urls = {};
  if (list.length){
    const { data } = await sb.storage.from('mdk-receipts').createSignedUrls(list.map(p=>p.receipt_path), 3600);
    (data||[]).forEach(r=>{ if (r.signedUrl) urls[r.path]=r.signedUrl; });
  }
  S.adm = { payments:list.map(p=>({ ...p, url:urls[p.receipt_path]||'' })), stats:stats.data||{}, users:dir.data||[] };
}

  if (pend){
    info = `To'lovingiz tekshirilmoqda (${pend.months} oy, ${money(pend.amount)}). Tasdiqlangach Pro avtomatik yoqiladi.`;
    btn = `<button class="btn" data-a="refresh">Holatni yangilash</button>`;

    info = pro ? `Amal qilish muddati: <b>${esc(st.plan_until)}</b>` : `Cheksiz mahsulot. Oyiga ${money(PLANS[0].price)} dan.`;

function signupBars(users){
  const today = new Date(); today.setHours(0,0,0,0);
  const days = [];
  for (let i=13;i>=0;i--){ const d=new Date(today); d.setDate(d.getDate()-i); days.push({ d, n:0 }); }
  users.forEach(u=>{ const t=new Date(u.created_at); t.setHours(0,0,0,0); const x=days.find(k=>k.d.getTime()===t.getTime()); if (x) x.n++; });
  const max = Math.max(1, ...days.map(k=>k.n));
  return `<div class="bars">${days.map(k=>`<div class="b" title="${esc(k.d.toLocaleDateString('ru-RU'))}: ${k.n}"><span>${k.n||''}</span><i style="height:${k.n?Math.max(6,Math.round(k.n/max*100)):3}px;${k.n?'':'opacity:.3'}"></i></div>`).join('')}</div>
    <div class="toolbar" style="margin:8px 0 0"><span class="cnt">${esc(days[0].d.toLocaleDateString('ru-RU'))}</span><span class="cnt">Bugun</span></div>`;
}

  if (!A.payments.length) return `<div class="empty">${IC.card(40)}<b>Hali to'lov yo'q</b>Sotuvchilar Pro sotib olganda chek shu yerda ko'rinadi.</div>`;
  return A.payments.map(p=>`<div class="card order" style="box-shadow:none"><div class="pay-row">${p.url?`<a class="rcpt" target="_blank" rel="noopener" href="${esc(p.url)}"><img src="${esc(p.url)}" alt="Chek"></a>`:'<div class="rcpt"></div>'}
    <div style="flex:1;min-width:0"><div class="toolbar" style="margin:0"><b>${esc(p.mdk_stores?p.mdk_stores.name:"Do'kon")}</b><span class="st ${p.status==='approved'?'done':p.status==='rejected'?'cancelled':''}">${stl[p.status]||''}</span></div>

}

function viewAdmin(){
  if (!S.user || !S.isAdmin) return viewAdminLogin();
  const A = S.adm || { payments:[], stats:{}, users:[] };
  const st = A.stats || {};
  const pend = A.payments.filter(p=>p.status==='pending');
  const tab = (k,ic,t,b) => `<button class="${S.admTab===k?'on':''}" data-a="admtab" data-v="${k}">${ic} ${t}${b?`<span class="badge">${b}</span>`:''}</button>`;
  const search = (id,ph) => `<div class="search" style="margin-top:0"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg><input type="search" id="${id}" placeholder="${ph}" value="${esc(S.admQ)}" autocomplete="off"></div>`;

  else if (S.admTab==='users') body = search('uq','Email, do\'kon nomi yoki manzil bo\'yicha qidirish') + `<div id="utbl">${usersTable()}</div>`;
  else if (S.admTab==='stores') body = search('sq','Do\'kon yoki email bo\'yicha qidirish') + `<div id="stlist">${storesList()}</div>`;
  else if (S.admTab==='pay') body = admPayments(A);
  else body = admSettings();
  return `<div class="top"><div class="in"><a class="logo" data-a="admtab" data-v="over"><div class="mark">${IC.shield(19)}</div><span class="t">MiniDokon Admin</span></a>
      <div class="actions"><button class="btn sm ghost adm-hide" data-a="home">Saytni ko'rish</button><button class="btn sm" data-a="admlogout">Chiqish</button></div></div></div>
    <div class="wrap" style="padding-bottom:60px">${S.admWarn?`<div class="msg err" style="margin-top:16px">${esc(S.admWarn)}</div>`:''}
    <div class="dash-head"><div><h1>Boshqaruv paneli</h1><span class="pill pro">${esc(S.user.email||'Admin')}</span></div></div>
    <div class="seg">${tab('over',IC.chart(17),'Umumiy')}${tab('users',IC.user(17),'Foydalanuvchilar')}${tab('stores',IC.store(17),"Do'konlar")}${tab('pay',IC.card(17),"To'lovlar",pend.length||'')}${tab('set',IC.cog(17),'Sozlamalar')}</div>

/* ---------- render va yo'naltirish ---------- */
function render(){
  const h = location.hash || '#/';
  const active = document.activeElement && document.activeElement.id;
  let html;
  if (/^#\/s\/[a-z0-9-]+/.test(h)) html = viewShop();
  else if (h.startsWith('#/admin')) html = viewAdmin();
  else if (h.startsWith('#/auth')) html = viewAuth();
  else if (h.startsWith('#/panel')){
    if (!S.user) html = viewAuth();
    else if (!S.store) html = viewCreateStore();
    else html = viewPanel();
  } else html = viewHome();
  app.innerHTML = html;
  if (active==='q'){ const q=document.getElementById('q'); if(q){ q.focus(); q.setSelectionRange(q.value.length,q.value.length); } }
}
async function route(){
  const h = location.hash || '#/';
  const mShop = h.match(/^#\/s\/([a-z0-9-]+)/);
  S.editing=null; S.detail=null; S.cartOpen=false; S.orderDone=null; S.q=''; S.payOpen=false; S.admErr='';
  if (mShop){ app.innerHTML='<div class="loader"><i></i></div>'; await loadShop(mShop[1]); document.title = S.shop ? S.shop.name : 'MiniDokon'; }
  else { document.title='MiniDokon'; if (h.startsWith('#/panel') && S.user) await loadMine(); if (h.startsWith('#/admin') && S.user){ await checkAdmin(); if (S.isAdmin) await loadAdmin(); } }
  if (h.startsWith('#/auth') && S.user) return go(S.isAdmin ? '#/admin' : '#/panel');
  render(); window.scrollTo(0,0);
}

/* ---------- rasmni kichraytirish ---------- */
function shrink(file, max=1000){
  return new Promise((res,rej)=>{
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = ()=>{
      const k = Math.min(1, max/Math.max(img.width,img.height));
      const c = document.createElement('canvas'); c.width=Math.round(img.width*k); c.height=Math.round(img.height*k);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(url);
      c.toBlob(b=> b?res(b):rej(new Error("Rasm o'qilmadi")), 'image/webp', .82);
    };
    img.onerror = ()=>{ URL.revokeObjectURL(url); rej(new Error("Rasm o'qilmadi")); };
    img.src = url;
  });
}

/* ---------- hodisalar ---------- */
document.addEventListener('input', e=>{
  if (e.target.id==='uq'){ S.admQ=e.target.value; const g=document.getElementById('utbl'); if (g) g.innerHTML=usersTable(); }
  if (e.target.id==='sq'){ S.admQ=e.target.value; const g=document.getElementById('stlist'); if (g) g.innerHTML=storesList(); }
  if (e.target.id==='q'){ S.q = e.target.value; const g=document.getElementById('grid'); if (g) g.innerHTML = shopGridHtml(); }
});
document.addEventListener('click', async e=>{
  const el = e.target.closest('[data-a]');
  if (!el) return;
  if (el.classList.contains('modal') && e.target.closest('[data-stop]')) return;
  const a = el.dataset.a, id = el.dataset.id;
  if (el.tagName==='A' && !el.getAttribute('target')) e.preventDefault();
  try{
    if (a==='home') go('#/');
    else if (a==='top') window.scrollTo({top:0,behavior:'smooth'});
    else if (a==='scroll'){ if ((location.hash||'#/')!=='#/'){ go('#/'); await new Promise(r=>setTimeout(r,60)); } const t=document.getElementById(el.dataset.v); if(t) t.scrollIntoView({behavior:'smooth',block:'start'}); }
    else if (a==='login'){ S.authMode='login'; go('#/auth'); render(); }
    else if (a==='signup'){ S.authMode='signup'; if (S.user) go('#/panel'); else { go('#/auth'); render(); } }
    else if (a==='panel') go('#/panel');
    else if (a==='logout'){ await sb.auth.signOut(); S.user=null; S.store=null; go('#/'); }
    else if (a==='tab'){ S.tab=el.dataset.v; render(); }
    else if (a==='copy'){ const ok = await copyText(shopUrl(S.store.slug)); flash(ok ? 'Havola nusxalandi' : "Nusxalab bo'lmadi. Havolani bosib turib belgilang."); }
    else if (a==='sharelink'){
      const u = shopUrl(S.shop.slug);
      if (navigator.share){ try{ await navigator.share({title:S.shop.name,url:u}); }catch(_){} }
      else { const ok = await copyText(u); flash(ok ? 'Havola nusxalandi' : u); }
    }
    else if (a==='open') window.open(shopUrl(S.store.slug),'_blank');
    else if (a==='addprod'){ S.editing='new'; render(); }
    else if (a==='edit'){ S.editing=id; render(); }
    else if (a==='closemodal'){ S.editing=null; S.detail=null; S.cartOpen=false; S.orderDone=null; S.payOpen=false; render(); }
    else if (a==='buy'){ S.payOpen=true; render(); }
    else if (a==='paymonths'){ S.payMonths=Number(el.dataset.v)||1; render(); }
    else if (a==='copycard'){ const ok = await copyText(String(payCard()).replace(/\s/g,'')); flash(ok ? 'Karta raqami nusxalandi' : "Nusxalab bo'lmadi. Raqamni bosib turib belgilang."); }
    else if (a==='refresh'){ await loadMine(); render(); flash('Yangilandi'); }
    else if (a==='admin') go('#/admin');
    else if (a==='admtab'){ if ((location.hash||'').startsWith('#/admin')){ S.admTab=el.dataset.v; S.admQ=''; S.admConfirm=null; render(); window.scrollTo(0,0); } }
    else if (a==='admlogout'){ await sb.auth.signOut(); S.user=null; S.isAdmin=false; S.adm=null; S.admErr=''; render(); }
    else if (a==='setpro'){
      const m = Number(el.dataset.v);
      const { error } = await sb.rpc('mdk_admin_set_plan', { p_store:id, p_months:m }); if (error) throw error;
      await loadAdmin(); render(); flash(m>0 ? 'Pro berildi' : 'Bepul tarifga qaytarildi');
    }
    else if (a==='delstore'){ S.admConfirm=id; render(); }
    else if (a==='delno'){ S.admConfirm=null; render(); }
    else if (a==='delyes'){
      const { error } = await sb.rpc('mdk_admin_delete_store', { p_store:id }); if (error) throw error;
      S.admConfirm=null; await loadAdmin(); render(); flash("Do'kon o'chirildi");
    }
    else if (a==='copyuid'){ const ok = await copyText(S.user.id); flash(ok ? 'Nusxalandi' : "Nusxalab bo'lmadi. Matnni bosib turib belgilang."); }
    else if (a==='approve' || a==='reject'){
      const { error } = await sb.rpc('mdk_review_payment', { p_id:id, p_approve:a==='approve' }); if (error) throw error;
      await loadAdmin(); render(); flash(a==='approve'?'Tasdiqlandi, Pro yoqildi':'Rad etildi');
    }
    else if (a==='toggle'){
      const p=S.products.find(x=>x.id===id); if(!p) return;
      const { error } = await sb.from('mdk_products').update({active:!p.active}).eq('id',id); if(error) throw error;
      p.active=!p.active; render();
    }
    else if (a==='del'){
      if (!confirm("Mahsulot o'chirilsinmi?")) return;
      const { error } = await sb.from('mdk_products').delete().eq('id',id); if(error) throw error;
      S.products=S.products.filter(x=>x.id!==id); render(); flash("Mahsulot o'chirildi");
    }
    else if (a==='ostat'){
      const { error } = await sb.from('mdk_orders').update({status:el.dataset.v}).eq('id',id); if(error) throw error;
      const o=S.orders.find(x=>x.id===id); if(o) o.status=el.dataset.v; render();
    }
    else if (a==='detail'){ S.detail=S.shopProducts.find(x=>x.id===id)||null; render(); }
    else if (a==='add'){
      S.cart[id]=(S.cart[id]||0)+1; saveCart();
      if (S.detail) { render(); } else { render(); flash("Savatga qo'shildi"); }
    }
    else if (a==='inc'){ S.cart[id]=Math.min(99,(S.cart[id]||0)+1); saveCart(); render(); }
    else if (a==='dec'){ S.cart[id]=(S.cart[id]||0)-1; if(S.cart[id]<=0) delete S.cart[id]; saveCart(); if(!cartCount()){ S.cartOpen=false; if(S.detail && S.detail.id!==id) S.detail=null; } render(); }
    else if (a==='cart'){ S.detail=null; S.cartOpen=true; render(); }
  }catch(err){ flash(errText(err)); }
});

document.addEventListener('submit', async e=>{
  e.preventDefault();
  const f = e.target, fd = new FormData(f), btn = f.querySelector('button[type=submit]');
  const box = f.querySelector('[id$="Msg"]');
  btn.disabled = true;
  try{
    if (f.id==='authForm'){
      const email=fd.get('email').trim(), password=fd.get('password');
      if (S.authMode==='signup'){
        const { data, error } = await sb.auth.signUp({ email, password }); if (error) throw error;
        if (!data.session){ note(box,'ok',"Emailingizga tasdiqlash xati yuborildi. Havolani bosing va keyin kiring."); btn.disabled=false; return; }
      } else {
        const { error } = await sb.auth.signInWithPassword({ email, password }); if (error) throw error;
      }
      return;
    }
    if (f.id==='storeForm'){
      const slug = slugify(fd.get('slug'));
      const row = { name:fd.get('name').trim(), slug, telegram:cleanTg(fd.get('telegram')), phone:fd.get('phone').trim(), description:fd.get('description').trim() };
      const { error } = await sb.from('mdk_stores').insert(row); if (error) throw error;
      await loadMine(); S.tab='products'; render(); flash("Do'kon ochildi. Birinchi mahsulotni qo'shing."); return;
    }
    if (f.id==='setForm'){
      const row = { name:fd.get('name').trim(), telegram:cleanTg(fd.get('telegram')), phone:fd.get('phone').trim(), description:fd.get('description').trim() };
      const { error } = await sb.from('mdk_stores').update(row).eq('id',S.store.id); if (error) throw error;
      Object.assign(S.store,row); note(box,'ok','Saqlandi'); btn.disabled=false; return;
    }
    if (f.id==='prodForm'){
      const old = S.editing==='new' ? null : S.products.find(x=>x.id===S.editing);
      let image_url = old ? old.image_url : '';
      const file = fd.get('img');
      if (file && file.size){
        const blob = await shrink(file);
        const path = `${S.user.id}/${Date.now()}.webp`;
        const up = await sb.storage.from('mdk-images').upload(path, blob, { contentType:'image/webp' }); if (up.error) throw up.error;
        image_url = sb.storage.from('mdk-images').getPublicUrl(path).data.publicUrl;
      }
      const row = { name:fd.get('name').trim(), price:Number(fd.get('price')||0), description:fd.get('description').trim(), image_url };
      if (old){
        const { data, error } = await sb.from('mdk_products').update(row).eq('id',old.id).select().single(); if (error) throw error;
        Object.assign(old,data);
      } else {
        const { data, error } = await sb.from('mdk_products').insert({ ...row, store_id:S.store.id }).select().single(); if (error) throw error;
        S.products.unshift(data);
      }
      S.editing=null; render(); flash('Saqlandi'); return;
    }
    if (f.id==='adminLoginForm'){
      const { data, error } = await sb.auth.signInWithPassword({ email:fd.get('email').trim(), password:fd.get('password') }); if (error) throw error;
      S.user = data.user; await checkAdmin();
      if (!S.isAdmin){ await sb.auth.signOut(); S.user=null; throw new Error('Bu hisob admin emas.'); }
      S.admErr=''; S.admTab='over'; await loadAdmin(); render(); return;
    }
    if (f.id==='cardForm'){
      const card = fd.get('card').trim(), holder = fd.get('holder').trim();
      if (!/^[0-9 ]+$/.test(card) || card.replace(/\s/g,'').length!==16) throw new Error("Karta raqami 16 ta raqamdan iborat bo'lsin.");
      const { error } = await sb.from('mdk_config').upsert([{ key:'pay_card', value:card }, { key:'pay_holder', value:holder }]); if (error) throw error;
      S.cfg.pay_card=card; S.cfg.pay_holder=holder; note(box,'ok','Saqlandi'); btn.disabled=false; return;
    }
    if (f.id==='pwForm'){
      const p1 = fd.get('p1'), p2 = fd.get('p2');
      if (p1.length<8) throw new Error("Parol kamida 8 belgidan iborat bo'lsin.");
      if (p1!==p2) throw new Error('Parollar bir xil emas.');
      const { error } = await sb.auth.updateUser({ password:p1 }); if (error) throw error;
      f.reset(); note(box,'ok','Parol almashtirildi. Keyingi kirishda yangi paroldan foydalaning.'); btn.disabled=false; return;
    }
    if (f.id==='payForm'){
      const file = fd.get('receipt');
      if (!file || !file.size) throw new Error('Chek rasmini yuklang');
      const blob = await shrink(file, 1400);
      const path = `${S.user.id}/chek-${Date.now()}.webp`;
      const up = await sb.storage.from('mdk-receipts').upload(path, blob, { contentType:'image/webp' }); if (up.error) throw up.error;
      const { error } = await sb.rpc('mdk_submit_payment', { p_months:S.payMonths, p_receipt:path }); if (error) throw error;
      await loadMine(); S.payOpen=false; render(); flash("Chek yuborildi. Tasdiqlangach Pro yoqiladi."); return;
    }
    if (f.id==='orderForm'){
      const items = S.shopProducts.filter(p=>S.cart[p.id]).map(p=>({ p, qty:S.cart[p.id] }));
      if (!items.length) throw new Error("Savat bo'sh");
      const name = fd.get('customer_name').trim(), phone = fd.get('customer_phone').trim(), noteTxt = fd.get('note').trim();
      const rows = items.map(i=>({ store_id:S.shop.id, product_id:i.p.id, product_name:i.p.name, qty:i.qty, customer_name:name, customer_phone:phone, note:noteTxt }));
      const { error } = await sb.from('mdk_orders').insert(rows); if (error) throw error;
      S.orderDone = { items:items.map(i=>({name:i.p.name,qty:i.qty})), total:cartTotal(), name, phone };
      S.cart = {}; saveCart(); S.cartOpen=false; render(); return;
    }
  }catch(err){
    if (f.id==='adminLoginForm') S.admErr = errText(err);
    if (box) note(box,'err',errText(err)); else flash(errText(err));
    btn.disabled=false;
  }
});

window.addEventListener('hashchange', route);
sb.auth.onAuthStateChange((ev, session)=>{
  const was = S.user && S.user.id;
  S.user = session ? session.user : null;
  if ((S.user && S.user.id) !== was){
    setTimeout(async ()=>{
      if (S.user){
        await loadMine(); await checkAdmin();
        const hh = location.hash || '';
        if (S.isAdmin && (hh.startsWith('#/admin') || hh.startsWith('#/auth'))) await loadAdmin();
        if (hh.startsWith('#/auth')) go(S.isAdmin ? '#/admin' : '#/panel'); else render();
      }
      else { S.store=null; S.isAdmin=false; S.adm=null; S.payments=[]; render(); }
    },0);
  }
});
(async()=>{
  const { data } = await sb.auth.getSession();
  S.user = data.session ? data.session.user : null;
  await checkAdmin();
  await loadCfg();
  await route();
})();
</script>
</body>
</html>
